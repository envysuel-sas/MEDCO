<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="margin-top:auto;background:rgba(255,255,255,0.94);border-top:0.5px solid #D8E4EB;padding:8px 8px 26px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;font-family:Poppins,system-ui,sans-serif">
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;color:{{ cAuj }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="4.6" height="4.6" rx="1.2" stroke="currentColor" stroke-width="1.5"></rect><rect x="9.7" y="4" width="4.6" height="4.6" rx="1.2" fill="currentColor"></rect><rect x="15.4" y="4" width="4.6" height="4.6" rx="1.2" stroke="currentColor" stroke-width="1.5"></rect><rect x="4" y="9.7" width="4.6" height="4.6" rx="1.2" stroke="currentColor" stroke-width="1.5"></rect><rect x="9.7" y="9.7" width="4.6" height="4.6" rx="1.2" stroke="currentColor" stroke-width="1.5"></rect><rect x="15.4" y="9.7" width="4.6" height="4.6" rx="1.2" stroke="currentColor" stroke-width="1.5"></rect><rect x="4" y="15.4" width="4.6" height="4.6" rx="1.2" stroke="currentColor" stroke-width="1.5"></rect><rect x="9.7" y="15.4" width="4.6" height="4.6" rx="1.2" stroke="currentColor" stroke-width="1.5"></rect><rect x="15.4" y="15.4" width="4.6" height="4.6" rx="1.2" stroke="currentColor" stroke-width="1.5"></rect></svg>
    <span style="font-size:10px;font-weight:500;letter-spacing:0.01em">Aujourd'hui</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;color:{{ cPil }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2.5" stroke="currentColor" stroke-width="1.5"></rect><path d="M7.5 6v12M12 6v12M16.5 6v12M3 12h18" stroke="currentColor" stroke-width="1.2" opacity="0.75"></path></svg>
    <span style="font-size:10px;font-weight:500;letter-spacing:0.01em">Pilulier</span>
  </div>
  <div style="display:flex;justify-content:center;align-items:flex-end;padding-bottom:2px">
    <div style="width:52px;height:52px;border-radius:26px;background:linear-gradient(150deg,#1B6E92,#12566E);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(18,86,110,0.32)">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 4.5v13M4.5 11h13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;color:{{ cPro }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="6" rx="2" stroke="currentColor" stroke-width="1.5"></rect><rect x="3.5" y="13.5" width="17" height="6" rx="2" stroke="currentColor" stroke-width="1.5"></rect><path d="M13.5 7.5h3.5M13.5 16.5h3.5" stroke="currentColor" stroke-width="1.2" opacity="0.7"></path></svg>
    <span style="font-size:10px;font-weight:500;letter-spacing:0.01em">Produits</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;color:{{ cRep }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5.5 4.5h13v15l-6.5-4-6.5 4v-15z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><path d="M8.8 9h6.4" stroke="currentColor" stroke-width="1.2"></path></svg>
    <span style="font-size:10px;font-weight:500;letter-spacing:0.01em">Repères</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;pilulier&quot;,&quot;produits&quot;,&quot;reperes&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const on = '#12566E', off = '#56737F';
    const a = this.props.active || 'today';
    return {
      cAuj: a === 'today' ? on : off,
      cPil: a === 'pilulier' ? on : off,
      cPro: a === 'produits' ? on : off,
      cRep: a === 'reperes' ? on : off,
    };
  }
}
</script>
</body>
</html>
