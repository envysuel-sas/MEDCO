name = "medco-rappels"
main = "index.ts"
compatibility_date = "2026-08-01"

# §10.3 — plan gratuit : Cron Triggers à la minute, 100 000 requêtes/jour.
# Vingt utilisateurs et quelques rappels par jour : sans objet.
[triggers]
crons = ["* * * * *"]

# Route sur le nom de l'application, sous un préfixe de chemin.
#
# L'application est servie par un tunnel `cloudflared` : son enregistrement DNS
# est **proxifié** par Cloudflare, ce qu'exige justement une route de Worker.
# Les deux cohabitent donc sur le même nom d'hôte — même origine, pas de CORS,
# une seule entrée DNS, et un `webcal://` sous le domaine de l'application.
#
# Précédence : une route de Worker passe **avant** l'origine du tunnel. Tout ce
# qui n'est pas sous `/rappels/` continue vers le serveur de la maison.
[[routes]]
pattern = "medco.boes-home.com/rappels/*"
zone_name = "boes-home.com"

[[kv_namespaces]]
binding = "ABONNEMENTS"
id = "à renseigner au premier déploiement"

[vars]
# Doit correspondre au préfixe de la route ci-dessus.
BASE_CHEMIN = "/rappels"

# Adresse de contact exigée par VAPID (RFC 8292) : elle identifie l'émetteur
# auprès des services de push, elle n'est jamais transmise à l'appareil.
VAPID_SUJET = "mailto:contact@boes-home.com"
VAPID_CLE_PUBLIQUE = "à renseigner au premier déploiement"

# VAPID_CLE_PRIVEE est un secret : `wrangler secret put VAPID_CLE_PRIVEE`.
# Elle ne figure jamais dans le dépôt.
