name: build

# Spec §17.2 — lint → typecheck → test → build.
# Le jeu doré est **bloquant** : rien n'est publié si le cumul est faux.
#
# ⚠ Ce workflow ne déploie pas : l'application est servie depuis la maison,
# derrière un tunnel cloudflared (`docs/deploiement.md`). Il produit l'artefact
# que le serveur peut récupérer, et fait office de garde-fou sur `main`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Le jeu doré seul d'abord, pour que son échec soit lisible dans le
      # journal : c'est lui qui garantit la justesse du cumul (§16.1).
      - run: pnpm test:golden
      - run: pnpm test

      - run: pnpm build
        env:
          VITE_BASE: /
          VITE_URL_WORKER: https://medco.boes-home.com/rappels

      - uses: actions/upload-artifact@v4
        with:
          name: medco-dist
          path: dist
          retention-days: 14
