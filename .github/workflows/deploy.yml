name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Passer à `--frozen-lockfile` une fois pnpm-lock.yaml commité.
      - run: pnpm install

      - run: pnpm lint

      # --passWithNoTests à retirer dès que le jeu doré existe (lot L1).
      - run: pnpm test -- --passWithNoTests

      - run: pnpm build
        env:
          # Domaine personnalisé → racine. Sur <pseudo>.github.io/medco/, mettre /medco/
          VITE_BASE: /

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
