name: deploy

# Spec §17.2 — lint → typecheck → test → build → GitHub Pages.
# Le jeu doré est **bloquant** : rien n'est déployé si le cumul est faux.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Jeu doré d'abord, et seul, pour que son échec soit lisible dans le
      # journal : c'est lui qui garantit la justesse du cumul (§16.1).
      - run: pnpm test:golden
      - run: pnpm test

      - run: pnpm build
        env:
          # Domaine personnalisé (public/CNAME) → l'application est à la racine.
          # Sur <compte>.github.io/medco/, mettre /medco/.
          VITE_BASE: /
          # Worker de rappel. Vide = couche calendrier seule, l'app le dit.
          VITE_URL_WORKER: ${{ vars.VITE_URL_WORKER }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
