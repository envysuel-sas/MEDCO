name: deploy

# Spec §17.2 — lint → typecheck → test → build → GitHub Pages.
# Le jeu doré est **bloquant** : rien n'est déployé si le cumul est faux.
#
# GitHub Pages héberge ; l'entrée publique est un tunnel cloudflared qui pointe
# ici (`docs/deploiement.md`). Le domaine personnalisé vient de `public/CNAME`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Le jeu doré seul d'abord, pour que son échec soit lisible dans le
      # journal : c'est lui qui garantit la justesse du cumul (§16.1).
      - run: pnpm test:golden
      - run: pnpm test

      - run: pnpm build
        env:
          # Domaine personnalisé (public/CNAME) → l'application est à la racine.
          VITE_BASE: /
          # Worker monté sur la même origine, sous /rappels (route Cloudflare).
          VITE_URL_WORKER: https://medco.boes-home.com/rappels

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Une pull request se contente de vérifier : elle ne publie pas.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
