# Tunnel cloudflared — /etc/cloudflared/config.yml
#
# ⚠ L'origine du tunnel n'est PAS un serveur de la maison : c'est GitHub Pages.
# `cloudflared` sert d'entrée, GitHub héberge. L'intérêt : l'enregistrement DNS
# devient un CNAME de tunnel, donc **proxifié** par Cloudflare — ce qu'exige une
# route de Worker (§10.3). Sans cela, l'application et le Worker ne pourraient
# pas partager le même nom d'hôte.
#
# Créé par :
#   cloudflared tunnel login
#   cloudflared tunnel create medco
#   cloudflared tunnel route dns medco medco.boes-home.com

tunnel: medco
credentials-file: /etc/cloudflared/medco.json

ingress:
  - hostname: medco.boes-home.com
    service: https://envysuel-sas.github.io
    originRequest:
      # ⚠ Les deux lignes qui suivent ne sont pas interchangeables.
      #
      # GitHub Pages route **par en-tête Host** : sans `httpHostHeader`, il
      # servirait la page d'accueil du compte, pas ce site.
      httpHostHeader: medco.boes-home.com
      # Le certificat présenté par GitHub couvre *.github.io : la validation TLS
      # doit se faire sur ce nom-là, pas sur le domaine personnalisé.
      originServerName: envysuel-sas.github.io
      connectTimeout: 30s
      # Le premier lancement télécharge ~3 Mo de catalogue.
      noHappyEyeballs: false

  # Règle terminale obligatoire.
  - service: http_status:404
